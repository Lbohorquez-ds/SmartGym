<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Gym</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <nav class="navbar">
    <a class="logo" href="#inicio">Desarrollo de Sist. de la Info.</a>

    <button class="menu-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false">
      ☰
    </button>

    <ul class="menu" id="menu">
      <li><a href="#inicio">Inicio</a></li>
      <li><a href="#propuesta1">Propuesta</a></li>
      <li><a href="#arquitectura">Arquitectura</a></li>
      <li><a href="#plan1">Plan</a></li>
      <li><a href="#equipo">Equipo</a></li>
      <li><a href="#logros">Logros</a></li>
      <li><a href="#futuro">Futuro</a></li>
      <li><a href="#demo">Demo</a></li>
      <li><a href="#fin">Fin</a></li>
    </ul>
  </nav>
</header>

<main>

  <!-- INICIO -->
  <section id="inicio" class="slide">
    <img src="img/1inicio.png" alt="Inicio Smart Gym">
  </section>

  <!-- PROPUESTA 1 -->
  <section id="propuesta1" class="slide con-botones">
    <img src="img/2propuesta_de_solucion1.png" alt="Problema, objetivo, alcances y limitaciones">

    <div class="botones">
      <a class="" href=""></a>
      <a class="btn" href="#propuesta2">Siguiente</a>
    </div>
  </section>

  <!-- PROPUESTA 2 -->
  <section id="propuesta2" class="slide con-botones">
    <img src="img/2propuesta_de_solucion3.png" alt="Qué hace Smart Gym">

    <div class="botones">
      <a class="btn btn-secundario" href="#propuesta1">Atrás</a>
      <a class="btn" href="#propuesta3">Siguiente</a>
    </div>
  </section>

  <!-- PROPUESTA 3 -->
  <section id="propuesta3" class="slide con-botones">
    <img src="img/2propuesta_de_solucion4.png" alt="Qué diferencia a Smart Gym">

    <div class="botones">
      <a class="btn btn-secundario" href="#propuesta2">Atrás</a>
    </div>
  </section>

  <!-- ARQUITECTURA -->
  <section id="arquitectura" class="slide">
    <img src="img/3arquitectura_tecnica.png" alt="Arquitectura técnica">
  </section>

  <!-- PLAN 1 -->
  <section id="plan1" class="slide con-botones">
    <img src="img/4plan_de_trabajo1.png" alt="Organización del proyecto">

     <div class="botones">
      <a class="" href=""></a>
      <a class="btn" href="#plan2">Siguiente</a>
    </div>
  </section>

  <!-- PLAN 2 -->
  <section id="plan2" class="slide con-botones">
    <img src="img/4plan_de_trabajo2.png" alt="Plan de trabajo">

    <div class="botones">
      <a class="btn btn-secundario" href="#plan1">Atrás</a>
    </div>
  </section>

  <!-- EQUIPO -->
  <section id="equipo" class="slide">
    <img src="img/5equipo.png" alt="Organización del equipo">
  </section>

  <!-- LOGROS -->
  <section id="logros" class="slide">
    <img src="img/6logros.png" alt="Logros obtenidos">
  </section>

  <!-- FUTURO -->
  <section id="futuro" class="slide">
    <img src="img/6trabajo_futuro.png" alt="Trabajo futuro">
  </section>

  <!-- DEMO -->
  <section id="demo" class="slide">
    <img src="img/7demo.png" alt="Demo Smart Gym">
  </section>

  <!-- FIN -->
  <section id="fin" class="slide">
    <img src="img/8fin.png" alt="Fin Smart Gym">
  </section>

</main>

<button class="top-btn" id="topBtn" aria-label="Volver al inicio">
  ↑
</button>

<script src="script.js"></script>

</body>
</html>
